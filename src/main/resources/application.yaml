spring:
  jackson:
    default-property-inclusion: NON_NULL

  application:
    name: prova-corrida

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres?currentSchema=prova_corrida
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update # create | create-drop | update | validate | none

    show-sql: true

    properties:
      hibernate:
        default_schema: prova_corrida
        format_sql: true
        jdbc:
          time_zone: UTC

  sql:
    init:
      mode: never # always para executar schema.sql/data.sql

logging:
  file:
    name: logs/prova-corrida.log

  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    com.github.dr3xcode.provacorrida: INFO

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"

  structured:
    format:
      file: logstash

server:
  port: 8080

management:
  #server:
   # port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: prova-corrida
  opentelemetry:
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs